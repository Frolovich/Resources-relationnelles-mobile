security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Hiérarchie des rôles : chaque rôle hérite des rôles inférieurs
    role_hierarchy:
        ROLE_MODERATOR:   ROLE_USER
        ROLE_ADMIN:       ROLE_MODERATOR
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        # Documentation API Platform (accès public)
        - { path: ^/api/docs,            roles: PUBLIC_ACCESS }
        - { path: ^/api/contexts,        roles: PUBLIC_ACCESS }

        # Public
        - { path: ^/api/login,           roles: PUBLIC_ACCESS }
        - { path: ^/api/register,        roles: PUBLIC_ACCESS }
        - { path: ^/api/resolve-email,   roles: PUBLIC_ACCESS }
        - { path: ^/api/password,        roles: PUBLIC_ACCESS }
        - { path: ^/api/public/resources, roles: PUBLIC_ACCESS }
        - { path: ^/api/categories,      roles: PUBLIC_ACCESS, methods: [GET] }

        # Citoyen connecté
        - { path: ^/api/me,              roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/my-resources,    roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/comment/create,  roles: ROLE_USER }
        - { path: ^/api/resources/upload, roles: ROLE_USER }
        - { path: ^/api/favorites,       roles: ROLE_USER }
        - { path: ^/api/comments,        roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/user-resources,  roles: ROLE_USER }

        # Modérateur
        - { path: ^/api/moderation,      roles: ROLE_MODERATOR }

        # Administrateur
        - { path: ^/api/admin,           roles: ROLE_ADMIN }

        # Super-administrateur
        - { path: ^/api/super-admin,     roles: ROLE_SUPER_ADMIN }

        # Tout le reste nécessite une authentification
        - { path: ^/api,                 roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
