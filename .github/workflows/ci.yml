name: CI

# Intégration continue : tests + qualité de code
# Déclenché à chaque push et Pull Request vers main / develop
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # Backend Symfony — PHPUnit (26 tests)
  # ============================================================
  backend-tests:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.2.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ressource
          MYSQL_USER: user
          MYSQL_PASSWORD: user
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uuser -puser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, pdo_mysql, zip, mbstring, opcache, ctype, iconv
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate JWT keys
        working-directory: backend
        run: php bin/console lexik:jwt:generate-keypair --overwrite --no-interaction
        env:
          JWT_PASSPHRASE: test_passphrase

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uuser -puser --silent; then break; fi
            sleep 2
          done

      - name: Run migrations (test DB)
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: "mysql://user:user@127.0.0.1:3306/ressource?serverVersion=8.2&charset=utf8mb4"
        run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Run PHPUnit
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: "mysql://user:user@127.0.0.1:3306/ressource?serverVersion=8.2&charset=utf8mb4"
          JWT_PASSPHRASE: test_passphrase
        run: php bin/phpunit --coverage-clover coverage-backend.xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage-backend.xml
        if: always()

  # ============================================================
  # Frontend web React — Jest
  # ============================================================
  frontend-tests:
    name: Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

  # ============================================================
  # Application mobile Expo — Jest (23 tests)
  # ============================================================
  mobile-tests:
    name: Mobile (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run tests
        working-directory: mobile
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

  # ============================================================
  # Audit de sécurité des dépendances (DevSecOps)
  # ============================================================
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Composer audit (backend)
        working-directory: backend
        run: composer audit --no-interaction || true

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (frontend)
        run: npm audit --audit-level=high || true

      - name: npm audit (mobile)
        working-directory: mobile
        run: npm audit --audit-level=high || true

  # ============================================================
  # Analyse qualité SonarCloud + Quality Gate
  # ============================================================
  sonarqube:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend-tests]
    # Ne s'exécute que si le secret SONAR_TOKEN est configuré
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
