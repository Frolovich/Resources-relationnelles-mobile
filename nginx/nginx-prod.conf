# ==============================================
# NGINX Production — Reverse proxy + médias + HTTPS
# ==============================================
# Sert le frontend statique, proxy l'API vers le backend Symfony,
# et expose les médias (images/vidéos).
# Certificats HTTPS via Let's Encrypt / CERTBOT.
# ==============================================

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # ACME challenge pour Let's Encrypt / CERTBOT
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name _;

    # Certificats (Let's Encrypt en prod, auto-signé en QA/préprod)
    ssl_certificate     /etc/letsencrypt/live/default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/default/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Performances
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 210M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- API Backend (proxy vers Symfony) ---
    location /api/ {
        proxy_pass http://backend.ressource:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Images ---
    location /images/ {
        alias /var/www/media/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Vidéos ---
    location /videos/ {
        alias /var/www/media/videos/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # --- Frontend statique (fallback SPA) ---
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}
