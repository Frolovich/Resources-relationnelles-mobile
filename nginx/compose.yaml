name: ressource_nginx
services:
  nginx_media:
    image: nginx:1.25-alpine
    container_name: nginx.media.ressource
    hostname: nginx.media.ressource
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./nginx-ssl.conf
        target: /etc/nginx/conf.d/ssl.conf
        read_only: true
      - type: bind
        source: ./ssl
        target: /etc/nginx/ssl
      - type: bind
        source: ./media/images
        target: /var/www/media/images
        read_only: true
      - type: bind
        source: ./media/videos
        target: /var/www/media/videos
        read_only: true
    entrypoint: /bin/sh -c "if [ ! -f /etc/nginx/ssl/fullchain.pem ]; then apk add --no-cache openssl && sh /etc/nginx/ssl/generate-cert.sh; fi && nginx -g 'daemon off;'"
