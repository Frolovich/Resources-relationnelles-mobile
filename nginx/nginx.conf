server {
    listen 80;
    server_name localhost;

    # ========================
    # Optimisation des performances
    # ========================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Compression gzip
    gzip on;
    gzip_types image/jpeg image/png image/webp image/gif video/mp4 video/webm;
    gzip_min_length 1000;

    # ========================
    # CORS headers (allow all origins for dev)
    # ========================
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

    # Handle preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ========================
    # Images
    # ========================
    location /images/ {
        alias /var/www/media/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header 'Access-Control-Allow-Origin' '*' always;

        location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
            try_files $uri =404;
        }
    }

    # ========================
    # Videos
    # ========================
    location /videos/ {
        alias /var/www/media/videos/;
        expires 7d;
        add_header Cache-Control "public";
        add_header 'Access-Control-Allow-Origin' '*' always;

        # Support du streaming (range requests)
        add_header Accept-Ranges bytes;

        location ~* \.(mp4|webm|ogg|mov)$ {
            try_files $uri =404;
        }
    }

    # ========================
    # Upload endpoint (via Symfony)
    # ========================
    location /upload/ {
        return 403;
    }

    # Bloquer tout le reste
    location / {
        return 404;
    }
}
