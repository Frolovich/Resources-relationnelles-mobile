# ==============================================
# SonarQube — Configuration du projet
# ==============================================
# Accès : http://localhost:9000
# Login par défaut : admin / admin
# ==============================================

sonar.projectKey=resources-relationnelles
sonar.projectName=(Re)Sources Relationnelles
sonar.projectVersion=1.0.0

# Sources à analyser
sonar.sources=backend/src,src,mobile/src

# Exclusions (dépendances, build, cache)
sonar.exclusions=**/node_modules/**,**/vendor/**,**/var/**,**/build/**,**/*.test.*,**/__tests__/**

# Tests
sonar.tests=backend/tests,mobile/__tests__

# Encodage
sonar.sourceEncoding=UTF-8

# PHP
sonar.php.file.suffixes=php

# JavaScript / TypeScript
sonar.javascript.file.suffixes=js,jsx
sonar.typescript.file.suffixes=ts,tsx
