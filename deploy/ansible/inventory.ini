# ==============================================
# Ansible — Inventaire des environnements
# ==============================================
# Décrit les serveurs cibles par environnement (QA / préprod / prod).
# Pour un contexte pédagogique, on peut cibler une VM locale
# (VirtualBox/Vagrant), localhost, ou un conteneur Docker.
#
# Usage :
#   ansible-playbook -i inventory.ini playbook.yml --limit qa
# ==============================================

[qa]
qa-server ansible_host=192.168.56.10

[preprod]
preprod-server ansible_host=192.168.56.11

[production]
prod-server ansible_host=api.ressources-relationnelles.fr

# --- Démonstration locale (projet pédagogique) ---
# Cible la machine locale : permet de jouer le playbook sans serveur distant.
[local]
localhost ansible_connection=local

[all:vars]
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
# Répertoire de déploiement sur le serveur
project_dir=/opt/ressources-relationnelles
